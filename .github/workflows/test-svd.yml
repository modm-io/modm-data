name: Generate SVD Files

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

jobs:
  generate-svd-stmicro:
    name: Generate STM32 SVD Files
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/modm-ext/modm-build-cortex-m:2026-09-28
    env:
      # Install over the Python packages of the image instead of uninstalling the Debian ones
      PIP_BREAK_SYSTEM_PACKAGES: 1
      PIP_IGNORE_INSTALLED: 1
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Fix Git permission/ownership problem
        run: |
          git config --global --add safe.directory '*'

      - name: Install Python Dependencies
        run: |
          pip3 install -r tools/requirements.txt -e .

      - name: Clone STMicro Sources
        run: |
          make clone-sources-arm ext/stmicro/header/ ext/stmicro/cubehal/

      - name: Generate SVD Files
        run: |
          python3 -m modm_data.header2svd.stmicro --all --output svd-archive/

      - name: Upload SVD Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-logs
          path: log/stmicro/svd
          retention-days: 1

      - name: Upload SVD Files
        uses: actions/upload-artifact@v4
        with:
          name: svd-archive
          path: svd-archive/
          retention-days: 7

      - name: Analyze Peripheral Variants
        run: |
          python3 -m modm_data.svd2variants --all --input svd-archive/ --output variants-archive/

      - name: Upload Variant Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-logs
          path: log/stmicro/variants
          retention-days: 1

      - name: Upload Peripheral Variants
        uses: actions/upload-artifact@v4
        with:
          name: variants-archive
          path: variants-archive/
          retention-days: 7

      - name: Zip SVD Files and Peripheral Variants
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          python3 -m zipfile -c svd-archive.zip svd-archive/
          python3 -m zipfile -c variants-archive.zip variants-archive/

      - name: Upload to Github Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        with:
          files: |
            svd-archive.zip
            variants-archive.zip
