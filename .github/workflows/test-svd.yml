name: Generate SVD Files

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

jobs:
  generate-svd-stmicro:
    name: Generate STM32 SVD Files
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip3 install -r tools/requirements.txt -e .

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Clone STMicro Sources
        run: |
          make clone-sources-arm ext/stmicro/header/ ext/stmicro/cubehal/

      - name: Generate SVD Files
        run: |
          python3 -m modm_data.header2svd.stmicro --all --output svd-archive/

      - name: Upload SVD Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-logs
          path: log/stmicro/svd
          retention-days: 1

      - name: Upload SVD Files
        uses: actions/upload-artifact@v4
        with:
          name: svd-archive
          path: svd-archive/
          retention-days: 7

      - name: Analyze Peripheral Variants
        run: |
          curl -fsSL --create-dirs -o ext/cache/svd2variants/feature-names-gemma.json \
            https://gist.githubusercontent.com/salkinium/12a18032caa303697c6583937f6fcd16/raw/feature-names-gemma.json || true
          python3 -m modm_data.svd2variants --all --input svd-archive/ --names ext/cache/svd2variants/feature-names-gemma.json \
            --no-generate --output variants-archive/

      - name: Upload Variant Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-logs
          path: log/stmicro/variants
          retention-days: 1

      - name: Upload Peripheral Variants
        uses: actions/upload-artifact@v4
        with:
          name: variants-archive
          path: variants-archive/
          retention-days: 7

      - name: Zip SVD Files and Peripheral Variants
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          zip -r svd-archive.zip svd-archive/
          zip -r variants-archive.zip variants-archive/

      - name: Upload to Github Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        with:
          files: |
            svd-archive.zip
            variants-archive.zip
