name: Export Clock Trees

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

jobs:
  export-clocks-stmicro:
    name: Export STM32 Clock Trees
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip3 install -r tools/requirements.txt -e .

      - name: Clone STMicro CubeMX Archive
        uses: actions/checkout@v4
        with:
          repository: modm-ext/archive-stmicro-cubemx
          path: ext/stmicro/cubemx
          ssh-key: ${{ secrets.SSH_KEY_STMICRO_CUBEMX }}

      - name: Clone STMicro Sources
        run: |
          make ext/stmicro/header/ ext/stmicro/cubehal/ ext/stmicro/hal2/stm32c5xx-dfp \
               ext/stmicro/hal2/stm32g5xx-dfp ext/stmicro/hal2/stm32h7pxx-dfp

      - name: Export Clock Trees
        run: |
          python3 -m modm_data.clocks --output clocks-archive/

      - name: Upload Clock Trees
        uses: actions/upload-artifact@v4
        with:
          name: clocks-archive
          path: clocks-archive/
          retention-days: 7

      - name: Zip Clock Trees
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          zip -r clocks-archive.zip clocks-archive/

      - name: Upload to Github Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        with:
          files: |
            clocks-archive.zip
