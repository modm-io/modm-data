name: Run Regression Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:

      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Check out Test Docs Repository
        uses: actions/checkout@v4
        with:
          repository: modm-ext/modm-data-test-docs
          path: ext/test/regression

      # This archive is private, so pull requests from forks skip the CubeProg tests
      - name: Check out STMicro CubeProg Archive
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/checkout@v4
        with:
          repository: modm-ext/archive-stmicro-cubeprog
          path: ext/stmicro/cubeprog
          ssh-key: ${{ secrets.SSH_KEY_STMICRO_CUBEPROG }}

      - name: Check out STMicro STM32F4 DFP
        run: |
          make ext/stmicro/STM32F4xx_DFP

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip3 install -r tools/requirements.txt -e .

      - name: Run Regression Tests
        run: |
          make run-regression-tests

      - name: Run Unit Tests
        if: always()
        run: |
          pytest

      - name: Run Ruff Formatter
        if: always()
        uses: chartboost/ruff-action@v1
        with:
          version: "0.14.10"
          src: "./src"
          args: "format --check"

      - name: Run Ruff Linter
        if: always()
        uses: chartboost/ruff-action@v1
        with:
          version: "0.14.10"
          src: "./src"
          args: "check"
