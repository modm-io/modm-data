name: Build docs

on:
  push:
    branches:
      - main
      - main-**
  pull_request:

jobs:
  build-upload-docs:
    runs-on: ubuntu-latest
    # Only one deployment at a time, otherwise the pushes to data.modm.dev race.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install modm-data with docs dependencies
        run: |
          pip3 install -r tools/requirements.txt -e ".[docs]"
          pip3 install git+https://github.com/modm-ext/modm-pinout.git@main

      - name: Install ARM toolchain and sources for the SVD files
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          make clone-sources-arm ext/stmicro/header/ ext/stmicro/cubehal/


      # These archive repositories are private since copyright prevents republishing!
      - name: Clone STMicro HTML Archive for the board pinouts
        uses: actions/checkout@v4
        with:
          repository: modm-ext/archive-stmicro-html
          path: ext/stmicro/html-archive
          ssh-key: ${{ secrets.SSH_KEY_STMICRO_HTML }}

      - name: Clone STMicro CubeMX Archive for the board pinouts
        uses: actions/checkout@v4
        with:
          repository: modm-ext/archive-stmicro-cubemx
          path: ext/stmicro/cubemx
          ssh-key: ${{ secrets.SSH_KEY_STMICRO_CUBEMX }}


      - name: Clone modm-ext/data.modm.dev repository
        if: startsWith(github.ref, 'refs/heads/main')
        uses: actions/checkout@v4
        with:
          repository: modm-ext/data.modm.dev
          ssh-key: ${{secrets.SSH_KEY_DATA_MODM_DEV}}
          path: docs/data.modm.dev


      - name: Build Homepage
        run: |
          make build-homepage


      - name: Upload Homepage for Review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: homepage
          path: docs/data.modm.dev/docs
          retention-days: 3


      - name: Push New Docs to Github
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          git config --global user.email "bot@modm.io"
          git config --global user.name "modm update bot"
          cd docs/data.modm.dev
          # The generated content replaces the repository wholesale, so rebase
          # onto whatever is on the remote instead of merging into it.
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update"
          git push origin main


      # TODO: Remove once data.modm.io redirects to data.modm.dev
      - name: Clone modm-ext/data.modm.io repository
        if: startsWith(github.ref, 'refs/heads/main')
        uses: actions/checkout@v4
        with:
          repository: modm-ext/data.modm.io
          ssh-key: ${{secrets.SSH_KEY_DATA_MODM_IO}}
          path: docs/data.modm.io


      - name: Push New Docs to data.modm.io
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          rm -rf docs/data.modm.io/docs
          cp -r docs/data.modm.dev/docs docs/data.modm.io/docs
          echo "data.modm.io" > docs/data.modm.io/docs/CNAME
          cd docs/data.modm.io
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update"
          git push origin main
