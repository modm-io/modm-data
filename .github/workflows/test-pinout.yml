name: Export Pinouts

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

jobs:
  export-pinouts:
    name: Export Device Pinouts
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip3 install -r tools/requirements.txt -e .

      - name: Clone STMicro CubeMX Archive
        uses: actions/checkout@v4
        with:
          repository: modm-ext/archive-stmicro-cubemx
          path: ext/stmicro/cubemx
          ssh-key: ${{ secrets.SSH_KEY_STMICRO_CUBEMX }}

      # These archive repositories are private since copyright prevents republishing!
      - name: Clone STMicro HTML Archive for the board pinouts
        uses: actions/checkout@v4
        with:
          repository: modm-ext/archive-stmicro-html
          path: ext/stmicro/html-archive
          ssh-key: ${{ secrets.SSH_KEY_STMICRO_HTML }}

      - name: Download the Device Sources
        run: |
          make -j4 device-sources download-stmicro-cubemx2

      - name: Export Pinouts
        run: |
          python3 -m modm_data.pinout --output pinout-archive/

      - name: Export Board Pinouts
        run: |
          python3 -m modm_data.html2pinout --output boards.json
          python3 -m modm_data.hal2pinout --merge --output boards.json

      - name: Upload Pinouts
        uses: actions/upload-artifact@v4
        with:
          name: pinout-archive
          path: |
            pinout-archive/
            boards.json
          retention-days: 7

      - name: Zip Pinouts
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          zip -r pinout-archive.zip pinout-archive/

      - name: Upload to Github Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        with:
          files: |
            pinout-archive.zip
            boards.json
